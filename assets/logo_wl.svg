<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" role="img" aria-label="White Lane">

  <!-- WL monogram -->
  <text
    x="0" y="36"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-size="32"
    font-weight="600"
    letter-spacing="-1"
    fill="#C9A84C">WL</text>

  <!-- Thin vertical divider -->
  <line x1="68" y1="8" x2="68" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- WHITE LANE wordmark -->
  <text
    x="80" y="30"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-size="15"
    font-weight="500"
    letter-spacing="4"
    fill="#FFFFFF">WHITE LANE</text>

</svg>
